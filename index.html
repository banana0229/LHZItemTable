<!DOCTYPE html>

	<style>
		body {

			font-size: 0.8em;
			line-height: 1.5em;
			color: #222;
		}
		
		.modal {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.5);
			justify-content: center;
			align-items: center;
		}
		
		.modal-window {
			background: #fff;
			padding: 20px;
			border-radius: 5px;
		}

		.modal-content {
			margin-top: 10px;
		}

		.modal.show {
			display: flex;
		}
		a:link,
		a:visited,
		a:link,
		a:visited {
			color: #333;
			text-decoration: underline;
		}

		a:hover,
		a:active,
		a:hover,
		a:active {
			color: #999;
			text-decoration: underline;
		}

		p {
			margin: 0;
			padding: 0;
		}

		input,
		select {
			vertical-align: middle;
		}

		.left {
			text-align: left;
		}

		.center {
			text-align: center;
		}

		.right {
			text-align: center;
		}

		table {
			width: 900px;
			border-collapse: collapse;
			margin-top: 10px;
		}

		table tr.odd {
			background-color: #eee;
		}

		table tr.odd_b {
			background-color: #a88;
		}

		table tr.eve_b {
			background-color: #caa;
		}

		table th {
			border: solid 1px #ccc;
			font-weight: normal;
			color: #fff;
			padding: 2px;
			background-color: #666;
		}

		table td {
			border: solid 1px #ccc;
			text-align: center;
		}

		.multiLine {
			white-space: pre-line;
		}
	</style>

		function escape(str) {
			str = str.replace(/&/g, '&amp;');
			str = str.replace(/</g, '&lt;');
			str = str.replace(/>/g, '&gt;');
			str = str.replace(/"/g, '&quot;');
			str = str.replace(/'/g, '&#39;');
			str = str.replace(/[A-Za-z0-9]/g, function (s) {
				return String.fromCharCode(s.charCodeAt(0) + 65248);
			});
			return str;
		}

		//重複チェック
		var checkDuplicate = function (array, str) {
			var array = array;
			var str = str;
			for (var i = 0; i < array.length; i++) {
				if (str == array[i]) {
					return true;
				}
			}
			return false;
		};

			document.getElementById('tag_list').innerHTML = tag_box;

		function tag_list() {
			for (var i = 0; i < items.length; i++) {
				for (var j = 0; j < items[i].tags.length; j++) {
					var tag = items[i].tags[j]
					if (!checkDuplicate(tagl, tag)) {
						tagl.push(tag);
					}
				}
			}
			tagl.sort();
		}

		function split_translation(mixed_str) {
			if (typeof mixed_str === 'string') {
				let start_index = 0;
				let end_index = mixed_str.length - 1;
				let leftCount = 0;
				let rightCount = 0;

				for (var i = mixed_str.length - 1; i >= 0; i--) {
					if (mixed_str[i] == ')') {
						leftCount++;
						if (leftCount == 1) {
							end_index = i;
						}
					}
					else if (mixed_str[i] == '(') {
						rightCount++;
						if (rightCount == leftCount) {
							start_index = i;
							break;
						}
					}
				}
				let original = start_index != 0 ? mixed_str.substring(start_index + 1, end_index) : mixed_str;
				let translated = start_index != 0 ? mixed_str.substring(0, start_index) : mixed_str;

				if(original.match(/^(.|..)級$/g))
				{
					return [mixed_str, mixed_str];
				}
				return [original, translated];
			}
			return undefined;
		}

			//隱藏彈窗
			document.getElementById('modal').classList.remove('show');
			//關閉確認
			document.getElementById('confirmBtn').disabled = true;
			//清除設定
			//document.getElementById('fileInput').value = '';
			//document.getElementById('typeSelect').value = "skills";
			clearManualInputValue();
		}

		function clearManualInputValue() {
			clearRadioValue("type");
			setCustomValue("item_name", "");
			setCustomValue("item_rank", "");
			setCustomValue("physical_attack", "");
			setCustomValue("magic_attack", "");
			setCustomValue("physical_defense", "");
			setCustomValue("magic_defense", "");
			setCustomValue("hit", "");
			setCustomValue("action", "");
			clearRadioValue("timing");
			setCustomValue("roll", "");
			setCustomValue("target", "");
			clearRadioValue("range");
			setCustomValue("range", "");
			setCustomValue("price", "");
			setCustomValue("tags", "");
			setCustomValue("function", "");
			setCustomValue("recipe", "");
		}

		function clearRadioValue(name) {
			var ele = document.getElementsByName(name);

			for (i = 0; i < ele.length; i++) {
				ele[i].checked = true;
				return;
			}
		}

		function getCustomValue(type) {
			var ele = document.getElementById(`custom_${type}`);

			if (ele) {
				return ele.value;
			}
			return null;
		}

		function setCustomValue(type, value) {
			var ele = document.getElementById(`custom_${type}`);

			if (ele) {
				ele.value = value;
			}
		}

		document.getElementById('custom_item_name').addEventListener('input', function () {
			//有道具名稱才能確認
			let confirmBtn = document.getElementById('confirmBtn');
			confirmBtn.disabled = !(this.value !== "");
		});

		//取消
		document.getElementById('cancelBtn').addEventListener('click', function () {
			close_upload_modal();
		});
		//確認
